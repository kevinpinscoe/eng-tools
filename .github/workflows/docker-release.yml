name: Docker Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  # write, not read: the SBOM step creates the GitHub release for the tag if one
  # does not exist, then uploads the SPDX documents to it
  contents: write
  packages: write
  id-token: write         # required for Cosign OIDC
  security-events: write  # required to upload the Grype SARIF report

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/kevinpinscoe/eng-tools
          tags: |
            type=ref,event=tag

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Bind an SPDX SBOM and SLSA provenance to the pushed digest. Registry
          # attestations on the manifest list, not files — they need the
          # docker-container driver and push: true, both already present above.
          # The Dockerfile's build-stage carries BUILDKIT_SBOM_SCAN_STAGE=true so the
          # npm dependency graph reaches the attestation; without it this SBOM would
          # list nginx and Alpine and nothing the app is built from.
          sbom: true
          provenance: mode=max

      # Resolve each platform's own digest out of the manifest list.
      #
      # steps.build.outputs.digest is the digest of the manifest LIST, and Grype
      # resolves a manifest list to the RUNNER's platform. That is why the gate enabled
      # on 2026-08-08 covered linux/amd64 only while linux/arm64 shipped unscanned —
      # built, signed, carrying its own SBOM, and never checked for CVEs.
      #
      # anchore/scan-action has no platform input. That was read from action.yml at the
      # pinned SHA rather than assumed, so the gap cannot be closed with a flag. Passing
      # a per-platform digest as image: targets that platform directly instead.
      #
      # Verified 2026-08-08 before this was written: grype's reported source imageID
      # (the image CONFIG digest) matches the config digest the registry lists for the
      # arm64 manifest, so this genuinely analyses arm64 rather than silently
      # re-scanning the runner's own architecture.
      - name: Resolve the per-platform digests
        id: digests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/kevinpinscoe/eng-tools@${DIGEST}"
          docker buildx imagetools inspect --raw "$IMAGE" > manifest-list.json

          for arch in amd64 arm64; do
            # os == "linux" also excludes the attestation manifests, which carry
            # architecture "unknown" and are not scannable images.
            d=$(jq -r --arg a "$arch" \
              '.manifests[] | select(.platform.architecture == $a and .platform.os == "linux") | .digest' \
              manifest-list.json)
            # An empty digest would reach the scan step as `image: ...@` and fail in a
            # way that reads like a scanner fault. Fail here, naming the real cause.
            [ -n "$d" ] || { echo "::error::no linux/$arch manifest in $IMAGE"; exit 1; }
            echo "$arch=$d" >> "$GITHUB_OUTPUT"
            echo "linux/$arch -> $d"
          done

      # Scan each published platform digest. BLOCKING as of 2026-08-08; arm64 joined
      # the gate on 2026-08-08 (gitops PLAN.md item 11a).
      #
      # Ran warn-only from 2026-08-04, when the image carried 44 findings at or above
      # high, later 2 — both libtiff (CVE-2023-52356, CVE-2026-4775) with no fix
      # available, so no rebuild would ever have cleared them.
      #
      # They were removed rather than waived. libtiff arrived via
      # nginx-module-image-filter -> libgd -> tiff, bundled in nginx:stable-alpine.
      # nginx.conf here is a single try_files block serving static assets, with no
      # image_filter, njs, xslt or geoip directive, so that module was never loaded.
      # The production stage moved to nginx:alpine-slim, which omits those modules and
      # their dependency chain. Measured after: ZERO findings at high or critical, on
      # BOTH platforms — arm64 was measured directly on 2026-08-08 and carried 3
      # findings, none at high or critical.
      # There is no .vex/openvex.json because nothing needed dispositioning.
      #
      # If this starts failing, the finding is real. Fix it, or remove the package, or
      # — only with evidence the vulnerable code is unreachable — add an OpenVEX
      # statement and pass it via a vex: input. Do NOT raise severity-cutoff, and do
      # NOT delete either scan.
      - name: Scan the published image for CVEs (linux/amd64)
        id: scan-amd64
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ghcr.io/kevinpinscoe/eng-tools@${{ steps.digests.outputs.amd64 }}
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      # Each upload sits immediately after its own scan, so the report is consumed
      # before the next scan runs. Do not reorder them into scan/scan/upload/upload.
      #
      # The categories must stay distinct: two SARIF uploads sharing one category
      # overwrite each other in the Security tab, so a single "grype-container" for
      # both platforms would show one arch and silently discard the other. The nightly
      # workflow's categories are distinct from these for the same reason.
      - name: Upload the scan results (linux/amd64)
        if: always() && steps.scan-amd64.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: ${{ steps.scan-amd64.outputs.sarif }}
          category: grype-container-amd64

      # if: always() so a failing amd64 scan does not hide arm64's result. Without it
      # the job stops at the first failing platform, you fix that one, cut another
      # release, and only then discover the second was failing too.
      - name: Scan the published image for CVEs (linux/arm64)
        id: scan-arm64
        if: always() && steps.digests.outputs.arm64 != ''
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ghcr.io/kevinpinscoe/eng-tools@${{ steps.digests.outputs.arm64 }}
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      - name: Upload the scan results (linux/arm64)
        if: always() && steps.scan-arm64.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: ${{ steps.scan-arm64.outputs.sarif }}
          category: grype-container-arm64

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        run: |
          cosign sign --yes \
            ghcr.io/kevinpinscoe/eng-tools@${{ steps.build.outputs.digest }}

      # Export the SBOM attestation as a release record. The registry attestation is
      # the source of truth; these files are a convenience copy for reading the
      # inventory without a registry client, and the two can drift.
      #
      # The platform key shape is asserted, not assumed: jq -e fails on a missing
      # path rather than writing null, and a zero-package document is rejected. An
      # empty SBOM is indistinguishable from a passing one at a glance.
      - name: Export the SBOM as a release record
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/kevinpinscoe/eng-tools@${DIGEST}"
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .SBOM }}' > sbom-raw.json

          echo "SBOM top-level keys:"
          jq -r 'keys[]' sbom-raw.json

          for plat in linux/amd64 linux/arm64; do
            out="sbom.${plat//\//-}.spdx.json"
            jq -e --arg p "$plat" '.[$p].SPDX' sbom-raw.json > "$out" || {
              echo "::error::no SPDX document at .[\"$plat\"].SPDX — the .SBOM key shape is not what this step expects"
              exit 1
            }
            pkgs=$(jq '.packages | length' "$out")
            echo "$out: $pkgs packages"
            [ "$pkgs" -gt 0 ] || { echo "::error::$out is empty"; exit 1; }

            # The build-stage scan lands in its OWN SPDX document under
            # AdditionalSPDXs; buildkit does not merge it into .SPDX. Exporting only
            # .SPDX drops the entire npm graph — measured on v2026.08.05, .SPDX held
            # 72 packages (nginx and Alpine) while the build stage held 1815.
            n=$(jq --arg p "$plat" '.[$p].AdditionalSPDXs? // [] | length' sbom-raw.json)
            echo "$plat: $n additional build-stage SPDX document(s)"
            i=0
            while [ "$i" -lt "$n" ]; do
              name=$(jq -r --arg p "$plat" --argjson i "$i" \
                '.[$p].AdditionalSPDXs[$i].name // "stage\($i)"' sbom-raw.json)
              aout="sbom.${plat//\//-}.${name}.spdx.json"
              jq -e --arg p "$plat" --argjson i "$i" \
                '.[$p].AdditionalSPDXs[$i]' sbom-raw.json > "$aout"
              echo "$aout: $(jq '.packages | length' "$aout") packages"
              i=$((i + 1))
            done
          done

          echo "Exported SBOM documents:"; ls -1 sbom.*.spdx.json

      - name: Attach the SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No release for $TAG — creating one."
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          # Glob, not a fixed list: build-stage documents are named after their
          # stages, so a newly marked stage is picked up without editing this step.
          gh release upload "$TAG" sbom.*.spdx.json --clobber
