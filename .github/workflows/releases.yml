name: Release new versions

# Source release only — this workflow does NOT publish container images.
#
# It used to. The `docker-release` job it carried was inherited from
# CorentinTh/it-tools and pushed to `corentinth/it-tools` on both Docker Hub and
# GHCR — upstream's namespace, not ours — so it failed on every tag since this repo
# was forked. Removed 2026-08-06 rather than repointed, for two reasons:
#
#   1. `docker-release.yml` already publishes ghcr.io/kevinpinscoe/eng-tools on this
#      same trigger, with an SBOM, SLSA provenance, a Cosign signature and a CVE
#      scan. Repointing this job would have meant two workflows racing to push the
#      same tags, one of them signed and attested and one not.
#   2. We publish to GHCR, not Docker Hub. There is no Docker Hub credential in this
#      repo and there should not be one.
#
# What remains is the source artefact and changelog release.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # softprops/action-gh-release creates and updates the release

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Get release version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4

      - run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      - name: Build the app
        run: pnpm build

      - name: Zip the app
        run: zip -r eng-tools-${{ env.RELEASE_VERSION }}.zip dist/*

      - name: Get changelog
        id: changelog
        run: |
          EOF=$(openssl rand -hex 8)
          echo "changelog<<$EOF" >> $GITHUB_OUTPUT
          node ./scripts/getLatestChangelog.mjs >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      # draft: false, changed from upstream's draft: true.
      #
      # docker-release.yml attaches SBOM documents to the release for this same tag,
      # creating it if it does not exist yet. With two workflows running in parallel
      # on one tag, a draft flag here made the published/draft state depend on which
      # finished first — and SBOMs landing on a draft release are invisible until
      # someone remembers to publish it. Deterministic beats tidy.
      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: eng-tools-${{ env.RELEASE_VERSION }}.zip
          tag_name: v${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          body: |
            ## Container image

            - `ghcr.io/kevinpinscoe/eng-tools:${{ env.RELEASE_VERSION }}`
            - `ghcr.io/kevinpinscoe/eng-tools:nightly` — built from `main` daily

            Published by `docker-release.yml` with an SPDX SBOM, SLSA provenance and
            a Cosign signature bound to the digest. See
            [SUPPLY-CHAIN.md](https://github.com/kevinpinscoe/eng-tools/blob/main/SUPPLY-CHAIN.md)
            for how to verify them and what the SBOM does and does not cover.

            ## Changelog

            ${{ steps.changelog.outputs.changelog }}
