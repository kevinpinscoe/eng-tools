name: Docker nightly release

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  packages: write
  id-token: write         # required for Cosign OIDC — see the signing step below
  security-events: write  # required to upload the Grype SARIF report

jobs:
  check_date:
    runs-on: ubuntu-latest
    name: Check latest commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: print latest_commit
        run: echo ${{ github.sha }}

      - id: should_run
        continue-on-error: true
        name: check latest commit is less than a day
        if: ${{ github.event_name == 'schedule' }}
        run: test -z $(git rev-list --after="24 hours" ${{ github.sha }}) && echo "should_run=false" >> $GITHUB_OUTPUT

  ci:
    runs-on: ubuntu-latest
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      - name: Run linters
        run: pnpm lint

      - name: Run unit test
        run: pnpm test

      - name: Build the app
        run: pnpm build

  build:
    runs-on: ubuntu-latest
    needs:
      - ci

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kevinpinscoe/eng-tools:nightly
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            COMMIT_DATE=${{ github.event.head_commit.timestamp }}
          # Same attestations as the tagged release. :nightly is a published,
          # pullable image and there is no reason for it to carry less provenance
          # than a tagged one — if anything it changes more often.
          sbom: true
          provenance: mode=max

      # Scan the published digest. WARN ONLY — and unlike the tagged release, that is
      # the intended end state here, not a stage on the way to blocking.
      #
      # docker-release.yml sets fail-build: true. This workflow deliberately does not,
      # and the asymmetry is the decision rather than an oversight (Kevin, 2026-08-08):
      #
      #   A tagged release is a deliberate act with a human behind it. Blocking is the
      #   right response — the release does not happen and someone is there to see why.
      #
      #   A nightly is unattended and its entire value is freshness. Blocking it means
      #   a base-image CVE stops :nightly updating while the tag stays pullable, so
      #   consumers keep receiving an OLDER image and nothing announces that it froze.
      #   That failure mode is worse than the one blocking prevents.
      #
      # Nothing escapes permanently: the same finding blocks the next tagged release,
      # and every finding lands in the Security tab in the meantime.
      #
      # Do not "fix" this to match docker-release.yml.
      #
      # Known limitation, tracked as gitops PLAN.md item 11a: Grype resolves a
      # multi-arch manifest to the runner's own platform, so this covers linux/amd64
      # only. The arm64 image is built, signed and has its own SBOM but is unscanned.
      # 11a fixes that across both this workflow and docker-release.yml.
      - name: Scan the published image for CVEs
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ghcr.io/kevinpinscoe/eng-tools@${{ steps.build.outputs.digest }}
          severity-cutoff: high
          fail-build: false
          output-format: sarif

      # A distinct category from docker-release.yml's "grype-container". Two SARIF
      # uploads sharing a category overwrite each other in the Security tab, so the
      # nightly result would silently replace the tagged one or vice versa.
      - name: Upload the scan results
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-container-nightly

      # This image was published UNSIGNED until 2026-08-04 — the nightly workflow had
      # no Cosign step at all, while the tagged release workflow did. Anyone pulling
      # :nightly had no way to verify who built it.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        run: |
          cosign sign --yes \
            ghcr.io/kevinpinscoe/eng-tools@${{ steps.build.outputs.digest }}
