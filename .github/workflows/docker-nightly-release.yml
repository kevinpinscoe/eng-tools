name: Docker nightly release

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  packages: write
  id-token: write         # required for Cosign OIDC — see the signing step below
  security-events: write  # required to upload the Grype SARIF report

jobs:
  check_date:
    runs-on: ubuntu-latest
    name: Check latest commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: print latest_commit
        run: echo ${{ github.sha }}

      - id: should_run
        continue-on-error: true
        name: check latest commit is less than a day
        if: ${{ github.event_name == 'schedule' }}
        run: test -z $(git rev-list --after="24 hours" ${{ github.sha }}) && echo "should_run=false" >> $GITHUB_OUTPUT

  ci:
    runs-on: ubuntu-latest
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      - name: Run linters
        run: pnpm lint

      - name: Run unit test
        run: pnpm test

      - name: Build the app
        run: pnpm build

  build:
    runs-on: ubuntu-latest
    needs:
      - ci

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kevinpinscoe/eng-tools:nightly
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            COMMIT_DATE=${{ github.event.head_commit.timestamp }}
          # Same attestations as the tagged release. :nightly is a published,
          # pullable image and there is no reason for it to carry less provenance
          # than a tagged one — if anything it changes more often.
          sbom: true
          provenance: mode=max

      # Resolve each platform's own digest out of the manifest list.
      #
      # steps.build.outputs.digest is the digest of the manifest LIST, and Grype
      # resolves a manifest list to the RUNNER's platform — so until 2026-08-08 this
      # scan covered linux/amd64 only, exactly as docker-release.yml did.
      #
      # anchore/scan-action has no platform input (read from action.yml at the pinned
      # SHA, not assumed), so the gap is closed by targeting each platform's own digest.
      - name: Resolve the per-platform digests
        id: digests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/kevinpinscoe/eng-tools@${DIGEST}"
          docker buildx imagetools inspect --raw "$IMAGE" > manifest-list.json

          for arch in amd64 arm64; do
            # os == "linux" also excludes the attestation manifests, which carry
            # architecture "unknown" and are not scannable images.
            d=$(jq -r --arg a "$arch" \
              '.manifests[] | select(.platform.architecture == $a and .platform.os == "linux") | .digest' \
              manifest-list.json)
            # An empty digest would reach the scan step as `image: ...@` and fail in a
            # way that reads like a scanner fault. Fail here, naming the real cause.
            [ -n "$d" ] || { echo "::error::no linux/$arch manifest in $IMAGE"; exit 1; }
            echo "$arch=$d" >> "$GITHUB_OUTPUT"
            echo "linux/$arch -> $d"
          done

      # Scan each published platform digest. WARN ONLY — and unlike the tagged release,
      # that is the intended end state here, not a stage on the way to blocking.
      #
      # docker-release.yml sets fail-build: true. This workflow deliberately does not,
      # and the asymmetry is the decision rather than an oversight (Kevin, 2026-08-08):
      #
      #   A tagged release is a deliberate act with a human behind it. Blocking is the
      #   right response — the release does not happen and someone is there to see why.
      #
      #   A nightly is unattended and its entire value is freshness. Blocking it means
      #   a base-image CVE stops :nightly updating while the tag stays pullable, so
      #   consumers keep receiving an OLDER image and nothing announces that it froze.
      #   That failure mode is worse than the one blocking prevents.
      #
      # Nothing escapes permanently: the same finding blocks the next tagged release,
      # and every finding lands in the Security tab in the meantime.
      #
      # Do not "fix" this to match docker-release.yml.
      #
      # The arm64 gap that this comment used to record as a known limitation
      # (gitops PLAN.md item 11a) is closed as of 2026-08-08 — both platforms are
      # scanned below. PLAN.md 11a named only the two tagged workflows; this one was
      # included because it is multi-arch and had the identical gap.
      - name: Scan the published image for CVEs (linux/amd64)
        id: scan-amd64
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ghcr.io/kevinpinscoe/eng-tools@${{ steps.digests.outputs.amd64 }}
          severity-cutoff: high
          fail-build: false
          output-format: sarif

      # Every category here is distinct from every other one in this repo. Two SARIF
      # uploads sharing a category overwrite each other in the Security tab, so a
      # nightly result would silently replace a tagged one — or one platform the other.
      # Four live categories exist: grype-container-{amd64,arm64} from the tagged
      # release, and grype-container-nightly-{amd64,arm64} from here.
      #
      # Each upload sits immediately after its own scan so the report is consumed
      # before the next scan runs. Do not reorder into scan/scan/upload/upload.
      - name: Upload the scan results (linux/amd64)
        if: always() && steps.scan-amd64.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: ${{ steps.scan-amd64.outputs.sarif }}
          category: grype-container-nightly-amd64

      - name: Scan the published image for CVEs (linux/arm64)
        id: scan-arm64
        if: always() && steps.digests.outputs.arm64 != ''
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ghcr.io/kevinpinscoe/eng-tools@${{ steps.digests.outputs.arm64 }}
          severity-cutoff: high
          fail-build: false
          output-format: sarif

      - name: Upload the scan results (linux/arm64)
        if: always() && steps.scan-arm64.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: ${{ steps.scan-arm64.outputs.sarif }}
          category: grype-container-nightly-arm64

      # This image was published UNSIGNED until 2026-08-04 — the nightly workflow had
      # no Cosign step at all, while the tagged release workflow did. Anyone pulling
      # :nightly had no way to verify who built it.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        run: |
          cosign sign --yes \
            ghcr.io/kevinpinscoe/eng-tools@${{ steps.build.outputs.digest }}
